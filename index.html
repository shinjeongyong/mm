<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#F5F7F1" />
<title>식단 달력</title>
<style>
  :root{
    --bg:#F5F7F1; --surface:#fff; --ink:#2A2D28; --sub:#77837A; --line:#E5E9E0;
    --green:#3E6B4E; --green-dark:#345C42; --green-soft:#EAF1EA;
    --honey:#CE8524; --honey-soft:#FBEFD9; --honey-line:#F0DCB4;
    --kid:#4A7A9E; --kid-soft:#E7EFF4;
    --wish:#8A5AA8; --wish-soft:#F1E9F6;
    --sun:#C0563E; --sat:#3E6B8E;
    --font:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.4;}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px;}
  .hidden{display:none !important;}

  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:36px 28px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(62,107,78,.08);}
  .login-card .logo{font-size:44px;margin-bottom:8px;}
  .login-card h1{margin:0 0 10px;font-size:22px;font-weight:800;letter-spacing:-.02em;}
  .login-card p{margin:0 0 26px;font-size:14px;color:var(--sub);line-height:1.6;}
  .gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;border:1px solid #DADCE0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;color:#3c4043;cursor:pointer;font-family:inherit;}
  .gbtn:active{background:#f7f8f9;}
  .login-note{margin-top:18px;font-size:12px;color:var(--sub);line-height:1.6;}
  .spinner{width:34px;height:34px;border:3px solid var(--green-soft);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;}
  .top-right{display:flex;align-items:center;gap:8px;}
  .today-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--green);cursor:pointer;font-family:inherit;}
  .today-btn:active{background:var(--green-soft);}
  .acct{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;font-family:inherit;}
  .acct:active{background:var(--bg);}

  .plan-tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;}
  .plan-tab{flex:1;border:none;background:transparent;border-radius:9px;padding:10px;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;}
  .plan-tab.active{background:var(--green-soft);color:var(--green);}
  .plan-tab.active[data-plan="kids"]{background:var(--kid-soft);color:var(--kid);}

  .monthbar{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px;}
  .navbtn{background:#fff;border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:20px;}
  .navbtn:active{background:var(--green-soft);}
  .monthlabel{font-size:19px;font-weight:800;min-width:130px;text-align:center;letter-spacing:-.01em;}

  .dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .dow{text-align:center;font-size:12px;font-weight:700;padding:2px 0;color:var(--sub);}
  .dow.s{color:var(--sun);} .dow.t{color:var(--sat);}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cell{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:88px;padding:7px 7px 6px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden;text-align:left;font-family:inherit;}
  .cell:active{border-color:var(--green);}
  .cell.blank{background:transparent;border-color:transparent;cursor:default;}
  .daynum{font-size:13px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .daynum.today{background:var(--green);color:#fff;}
  body.kids .daynum.today{background:var(--kid);}
  .daynum.sun{color:var(--sun);} .daynum.sat{color:var(--sat);}
  .preview{font-size:12px;line-height:1.38;color:#57625B;margin-top:4px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}

  .cards{margin-top:26px;display:grid;gap:14px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
  .card-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em;}
  .count{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;}
  .count.g{color:var(--green);background:var(--green-soft);}
  .count.h{color:var(--honey);background:var(--honey-soft);}
  .count.w{color:var(--wish);background:var(--wish-soft);}
  .items{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 13px;font-size:14px;font-weight:600;}
  .chip .move{border:none;background:var(--honey-soft);color:var(--honey);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;line-height:1;}
  .chip .del{border:none;background:none;cursor:pointer;color:var(--sub);display:flex;padding:0;font-size:15px;line-height:1;}
  .empty-note{font-size:13px;color:var(--sub);margin:0 0 13px;padding:2px 0;}
  .addrow{display:flex;gap:8px;}
  .field{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;outline:none;width:100%;}
  .field:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  .addbtn{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 15px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .addbtn:active{background:var(--green-dark);}
  .addbtn.honey{background:var(--honey);}
  .addbtn.wish{background:var(--wish);}

  .foot{text-align:center;font-size:12px;color:var(--sub);margin-top:24px;line-height:1.6;}
  #saveStatus{font-weight:700;}
  #saveStatus.saved{color:var(--green);} #saveStatus.pending{color:var(--honey);}

  .suggest{position:relative;flex:1;}
  .suggest-box{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:20;overflow:hidden;max-height:240px;overflow-y:auto;}
  .suggest-item{padding:10px 12px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .suggest-item:active{background:var(--green-soft);}
  .suggest-item .si-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .suggest-item .u{font-size:11px;color:var(--honey);font-weight:700;white-space:nowrap;margin-left:8px;}
  .suggest-item .si-del{border:none;background:none;color:var(--sub);cursor:pointer;font-size:16px;line-height:1;padding:0 4px;margin-left:6px;}
  .suggest-item .si-del:active{color:var(--sun);}

  .overlay{position:fixed;inset:0;background:rgba(30,40,32,.42);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .overlay.show{display:flex;}
  .sheet{background:var(--bg);border-radius:20px;width:100%;max-width:460px;max-height:86vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .sheet-in{padding:20px 20px 24px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .sheet-title{font-size:18px;font-weight:800;letter-spacing:-.01em;}
  .sheet-title span{color:var(--sub);font-weight:600;font-size:15px;}
  .sheet-title .pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;margin-left:6px;}
  .pill.adult{background:var(--green-soft);color:var(--green);}
  .pill.kids{background:var(--kid-soft);color:var(--kid);}
  .closebtn{border:none;background:none;cursor:pointer;color:var(--sub);font-size:24px;line-height:1;padding:0 2px;}
  .flabel{font-size:13px;font-weight:700;color:var(--sub);display:block;margin-bottom:9px;}
  .hint{font-size:12px;color:var(--sub);}

  .meal-group{margin-bottom:12px;}
  .meal-label{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:7px;}
  .meal-empty{font-size:12px;color:var(--sub);padding:0 0 2px 2px;}
  .dishlist{display:flex;flex-direction:column;gap:8px;margin-bottom:0;}
  .meal-group .dishlist{margin-bottom:0;}
  .mg-list{display:flex;flex-direction:column;gap:8px;}
  .dish{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px 9px 13px;flex-wrap:wrap;}
  .dish-name{font-size:15px;font-weight:700;}
  .recipe{display:inline-flex;align-items:center;gap:6px;background:var(--honey-soft);color:var(--honey);border:1px solid var(--honey-line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;text-decoration:none;}
  .recipe:active{background:#F7E4C2;}
  .mini{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;font-family:inherit;white-space:nowrap;}
  .mini:active{background:var(--bg);}
  .mini.save{margin-left:8px;background:var(--green);color:#fff;border-color:var(--green);}
  .meal-sel{border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;font-family:inherit;color:var(--sub);background:#fff;cursor:pointer;}
  .dish-del{border:none;background:none;cursor:pointer;color:var(--sub);font-size:18px;line-height:1;padding:0 2px;}
  .dish-urledit{flex:1 1 100%;margin-top:6px;}

  .meal-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .mp{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 4px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;}
  .mp.active{background:var(--green-soft);color:var(--green);border-color:transparent;}
  body.kids .mp.active{background:var(--kid-soft);color:var(--kid);}

  .done{margin-top:22px;width:100%;background:var(--green);color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
  .done:active{background:var(--green-dark);}
  .mt8{margin-top:8px;}
  @media (max-width:520px){ .cell{min-height:78px;} }

  .dash{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 8px;margin-bottom:16px;cursor:pointer;}
  .dash:active{background:#FCFDFB;}
  .dash-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .dash-title{font-size:14px;font-weight:800;}
  .dash-title b{color:var(--sub);font-weight:700;margin-left:2px;}
  .dash .pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;}
  .dash-edit{margin-left:auto;font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap;}
  .dash-row{display:flex;gap:10px;padding:7px 0;align-items:baseline;}
  .dash-row + .dash-row{border-top:1px solid var(--line);}
  .dash-meal{flex:0 0 60px;font-size:13px;font-weight:700;color:var(--ink);}
  .dash-dishes{flex:1;font-size:13px;color:var(--ink);line-height:1.5;}
  .dash-empty{color:var(--sub);}
  .dash-dot{color:var(--line);margin:0 5px;}
  .dash-dish{white-space:nowrap;}
  .dash-link{color:var(--honey);text-decoration:none;font-weight:800;margin-left:3px;}

  .ing-group{margin-bottom:12px;}
  .ing-group .items{margin-bottom:0;}
  .ing-group:last-child{margin-bottom:0;}
  .ing-label{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:8px;}
  .ing-label .ing-n{color:var(--sub);font-weight:700;margin-left:2px;}
  .cat-sel{border:1px solid var(--line);border-radius:7px;padding:2px 4px;font-size:11px;font-family:inherit;color:var(--sub);background:#fff;cursor:pointer;}
  .cat-edit-btn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;white-space:nowrap;}
  .cat-edit-btn.on{background:var(--green-soft);color:var(--green);border-color:transparent;}
</style>
</head>
<body>

<div id="loading" class="center-screen"><div class="spinner"></div></div>

<div id="loginScreen" class="center-screen hidden">
  <div class="login-card">
    <div class="logo">🍳</div>
    <h1>식단 달력</h1>
    <p>구글 계정으로 로그인하세요.<br>허용된 사람끼리 같은 식단을 함께 봐요.</p>
    <button id="googleLoginBtn" class="gbtn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Google로 로그인
    </button>
    <div id="loginError" class="login-note" style="color:var(--sun);"></div>
    <div class="login-note">허용 목록에 등록된 구글 계정만 접근할 수 있어요.</div>
  </div>
</div>

<div id="appScreen" class="wrap hidden">
  <div class="top">
    <div class="brand"><span style="font-size:24px;">🍳</span><h1>식단 달력</h1></div>
    <div class="top-right">
      <button class="today-btn" id="todayBtn">오늘</button>
      <button class="acct" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="plan-tabs">
    <button class="plan-tab active" data-plan="adult">🍚 성인</button>
    <button class="plan-tab" data-plan="kids">🍼 유아식</button>
  </div>

  <div id="todayDash" class="dash"></div>

  <div class="monthbar">
    <button class="navbtn" id="prevBtn" aria-label="이전 달">‹</button>
    <div class="monthlabel" id="monthLabel"></div>
    <button class="navbtn" id="nextBtn" aria-label="다음 달">›</button>
  </div>

  <div class="dow-row" id="dowRow"></div>
  <div class="grid" id="grid"></div>

  <div class="cards">
    <div class="card">
      <div class="card-head"><span style="font-size:18px;">🧺</span><h2>현재 있는 식재료</h2><button class="cat-edit-btn" id="haveCatEdit" data-list="have">분류 바꾸기</button><span class="count g" id="haveCount">0</span></div>
      <div class="items" id="haveItems"></div>
      <div class="addrow">
        <div class="suggest"><input class="field" id="haveInput" placeholder="식재료 이름" autocomplete="off" /><div id="haveSuggest" class="suggest-box hidden"></div></div>
        <button class="addbtn" id="haveAdd">+ 추가</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span style="font-size:18px;">🛒</span><h2>구입할 식재료</h2><button class="cat-edit-btn" id="buyCatEdit" data-list="buy">분류 바꾸기</button><span class="count h" id="buyCount">0</span></div>
      <div class="items" id="buyItems"></div>
      <div class="addrow">
        <div class="suggest"><input class="field" id="buyInput" placeholder="식재료 이름" autocomplete="off" /><div id="buySuggest" class="suggest-box hidden"></div></div>
        <button class="addbtn honey" id="buyAdd">+ 추가</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span style="font-size:18px;">🍽️</span><h2>먹고싶은 메뉴</h2><span class="count w" id="wishCount">0</span></div>
      <p class="hint" style="margin:-6px 0 12px;">여기 담아두면, 날짜에 요리 등록할 때 ⭐ 추천으로 떠서 바로 넣을 수 있어요.</p>
      <div id="wishItems" class="dishlist"></div>
      <div class="suggest" style="margin-top:8px;"><input class="field" id="wishName" placeholder="먹고싶은 요리 이름" autocomplete="off" /><div id="wishSuggest" class="suggest-box hidden"></div></div>
      <div class="addrow mt8">
        <input class="field" id="wishUrl" placeholder="레시피 주소 (선택)" />
        <button class="addbtn wish" id="wishAdd">+ 추가</button>
      </div>
    </div>
  </div>

  <p class="foot">허용된 사람끼리 같은 식단을 공유해요. · <span id="saveStatus" class="saved">저장됨</span></p>
</div>

<div class="overlay" id="overlay">
  <div class="sheet"><div class="sheet-in">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle"></div>
      <button class="closebtn" id="closeBtn" aria-label="닫기">×</button>
    </div>
    <div id="dishList"></div>
    <label class="flabel" style="margin-top:6px;">요리 추가</label>
    <div class="meal-picker" id="mealPicker">
      <button type="button" class="mp" data-m="breakfast">🌅 아침</button>
      <button type="button" class="mp" data-m="lunch">☀️ 점심</button>
      <button type="button" class="mp active" data-m="dinner">🌙 저녁</button>
      <button type="button" class="mp" data-m="snack">🍪 간식</button>
    </div>
    <div class="suggest" style="margin-top:8px;"><input class="field" id="dishName" placeholder="요리 이름 (⭐ 먹고싶은 메뉴도 추천돼요)" autocomplete="off" /><div id="dishSuggest" class="suggest-box hidden"></div></div>
    <div class="addrow mt8">
      <input class="field" id="dishUrl" placeholder="레시피 주소 (선택)" />
      <button class="addbtn" id="dishAdd">+ 추가</button>
    </div>
    <button class="done" id="doneBtn">완료</button>
  </div></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc }
    from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCIII7NvmLR491_0q__DDexFPvbcXETCD0",
    authDomain: "meal-calendar-68655.firebaseapp.com",
    projectId: "meal-calendar-68655",
    storageBucket: "meal-calendar-68655.firebasestorage.app",
    messagingSenderId: "1007459549424",
    appId: "1:1007459549424:web:61da42968b5785b3004235"
  };
  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  const provider = new GoogleAuthProvider();
  const SHARED = () => doc(db, "shared", "mealplan");

  const WEEKDAYS = ["일","월","화","수","목","금","토"];
  const PLAN_LABEL = { adult:"성인", kids:"유아식" };
  const MEAL_ORDER = ["breakfast","lunch","dinner","snack"];
  const MEAL_LABEL = { breakfast:"🌅 아침", lunch:"☀️ 점심", dinner:"🌙 저녁", snack:"🍪 간식" };

  const CAT_SHORT = { meat:"육류", seafood:"수산물", veg:"채소", tofu:"두부·유제품", hmr:"간편식", etc:"기타" };
  const CAT_KW = {
    hmr:["비비고","수제","동그랑땡","만두","떡갈비","미트볼","돈까스","돈까쓰","까스","까쓰","너겟","너깃","핫도그","피자","밀키트","즉석","레토르트","그라탕","그라탱","육개장","스푸드립","죽","볶음밥","국밥","1팩","2팩","3팩","팩","찌개","전골","탕"],

    veg:["양파","대파","마늘","고추","애호박","양송이","버섯","시금치","배추","무","당근","감자","고구마","오이","호박","상추","깻잎","브로콜리","콩나물","숙주","가지","파프리카","쪽파","부추","미나리","청경채","셀러리","토마토","단호박","고사리","도라지","연근","우엉","팽이","느타리","표고"],
    tofu:["두부","순두부","치즈","우유","계란","달걀","요거트","버터","생크림","모짜렐라","리코타","연두부","유부"]

  function guessCategory(name){
    const n=(name||"").toLowerCase();
    for(const cat of ["hmr","meat","seafood","tofu","veg"]){
      if(CAT_KW[cat].some(k=>n.includes(k.toLowerCase()))) return cat;
    }
    return "etc";
  }
  const $ = (id) => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const keyOf = (y,m,d) => y + "-" + (m+1) + "-" + d;
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const normUrl = (u) => { const t=(u||"").trim(); if(!t) return ""; return /^https?:\/\//i.test(t)?t:"https://"+t; };

  const blankPlan = () => ({ meals:{}, dishLibrary:[], have:[], buy:[], ingredientLibrary:[], wishlist:[] });
  let state = { plans:{ adult:blankPlan(), kids:blankPlan() } };
  let currentPlan = "adult";
  let currentUser = null, saveTimer = null, selKey = null, editDishId = null, editWishId = null, addMeal = "dinner";
  const catEdit = { have:false, buy:false };
  const today = new Date();
  let vy = today.getFullYear(), vm = today.getMonth();

  const P = () => state.plans[currentPlan];
  const entryOf = (k) => P().meals[k] || { dishes:[] };
  const cacheKey = () => "mealCalendar:v3:" + (currentUser ? currentUser.uid : "anon");

  function upsertDish(planKey,name,url){
    name=(name||"").trim(); if(!name) return;
    const lib=state.plans[planKey].dishLibrary;
    const i=lib.findIndex(d=>d.name===name);
    if(i>=0){ if(url) lib[i].url=url; } else lib.push({name,url:url||""});
  }
  function upsertIngredient(planKey,name){
    name=(name||"").trim(); if(!name) return;
    const lib=state.plans[planKey].ingredientLibrary;
    if(!lib.includes(name)) lib.push(name);
  }

  function normalizeState(){
    if(!state.plans){
      if(state.meals || state.have || state.buy){
        state = { plans:{ adult:{
          meals:state.meals||{}, dishLibrary:state.dishLibrary||[],
          have:state.have||[], buy:state.buy||[], ingredientLibrary:state.ingredientLibrary||[], wishlist:state.wishlist||[]
        }, kids:blankPlan() } };
      } else { state = { plans:{ adult:blankPlan(), kids:blankPlan() } }; }
    }
    if(!state.categoryMap) state.categoryMap={};
    for(const key of ["adult","kids"]){
      if(!state.plans[key]) state.plans[key]=blankPlan();
      const pl=state.plans[key];
      if(!pl.meals) pl.meals={};
      if(!pl.dishLibrary) pl.dishLibrary=[];
      if(!pl.have) pl.have=[];
      if(!pl.buy) pl.buy=[];
      if(!pl.ingredientLibrary) pl.ingredientLibrary=[];
      if(!pl.wishlist) pl.wishlist=[];
      pl.have.forEach(i=>{ if(!i.cat) i.cat=state.categoryMap[i.name]||guessCategory(i.name); });
      pl.buy.forEach(i=>{ if(!i.cat) i.cat=state.categoryMap[i.name]||guessCategory(i.name); });
      Object.keys(pl.meals).forEach(k=>{
        const e=pl.meals[k]; if(!e) return;
        if(!e.dishes){
          e.dishes=[];
          if(e.menu && e.menu.trim()){
            e.menu.split(",").map(s=>s.trim()).filter(Boolean).forEach((nm,idx)=> e.dishes.push({id:uid(),name:nm,url:(idx===0&&e.recipes&&e.recipes[0])?e.recipes[0].url:"",meal:"dinner"}));
          }
          delete e.menu; delete e.recipes;
        }
        (e.dishes||[]).forEach(d=>{ if(!d.meal) d.meal="dinner"; });
      });
      if(pl.dishLibrary.length===0) Object.values(pl.meals).forEach(e=> (e.dishes||[]).forEach(d=> upsertDish(key,d.name,d.url)));
      if(pl.ingredientLibrary.length===0) pl.have.concat(pl.buy).forEach(i=> upsertIngredient(key,i.name));
    }
  }

  async function loadFromCloud(){
    try{ const c=localStorage.getItem(cacheKey()); if(c) state=JSON.parse(c); }catch(e){}
    try{
      const snap = await getDoc(SHARED());
      if(snap.exists() && snap.data().data) state=JSON.parse(snap.data().data);
      normalizeState();
      try{ localStorage.setItem(cacheKey(), JSON.stringify(state)); }catch(e){}
    }catch(e){ console.error("불러오기 실패(캐시 사용):", e); normalizeState(); }
  }

  function setSave(s){
    const el=$("saveStatus"); if(!el) return;
    if(s==="pending"){ el.textContent="저장 중…"; el.className="pending"; }
    else if(s==="saved"){ el.textContent="저장됨"; el.className="saved"; }
    else { el.textContent="저장 대기"; el.className="pending"; }
  }
  function save(){
    if(!currentUser) return;
    try{ localStorage.setItem(cacheKey(), JSON.stringify(state)); }catch(e){}
    setSave("pending");
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async ()=>{
      try{ await setDoc(SHARED(),{data:JSON.stringify(state),updatedAt:Date.now(),updatedBy:currentUser.email||""}); setSave("saved"); }
      catch(e){ console.error("저장 실패:",e); setSave("wait"); }
    },700);
  }

  function renderCalendar(){

    const firstDow=new Date(vy,vm,1).getDay(), days=new Date(vy,vm+1,0).getDate();
    const thisMonth=(vy===today.getFullYear()&&vm===today.getMonth());
    const meals=P().meals; let h="";
    for(let b=0;b<firstDow;b++) h+='<div class="cell blank"></div>';
    for(let d=1;d<=days;d++){
      const k=keyOf(vy,vm,d), dow=(firstDow+d-1)%7, isT=thisMonth&&d===today.getDate();
      const numCls="daynum"+(isT?" today":(dow===0?" sun":(dow===6?" sat":"")));
      const e=meals[k]; let inner="";
      if(e && e.dishes && e.dishes.length){
        const ordered=[];
        for(const meal of MEAL_ORDER) e.dishes.filter(x=>(x.meal||"dinner")===meal).forEach(x=>ordered.push(x.name));

  function renderDash(){
    const box=$("todayDash"); if(!box) return;
    const tk=keyOf(today.getFullYear(),today.getMonth(),today.getDate());
    const e=P().meals[tk]; const dishes=(e&&e.dishes)||[];
    const dow=WEEKDAYS[today.getDay()];
    const pillCls=currentPlan==="kids"?"kids":"adult";
    let rows="";

      const list=dishes.filter(d=>(d.meal||"dinner")===meal);

      else content=list.map(d=>'<span class="dash-dish">'+esc(d.name)+(d.url?'<a class="dash-link" href="'+esc(d.url)+'" target="_blank" rel="noopener noreferrer" title="레시피">↗</a>':'')+'</span>').join('<span class="dash-dot">·</span>');

    }
    box.innerHTML='<div class="dash-head"><span class="dash-title">오늘 · '+(today.getMonth()+1)+'월 '+today.getDate()+'일 <b>'+dow+'</b></span><span class="pill '+pillCls+'">'+PLAN_LABEL[currentPlan]+'</span><span class="dash-edit">탭하여 편집</span></div>'+rows;

  function renderItems(){ renderList("have","haveItems","haveCount",false); renderList("buy","buyItems","buyCount",true); }
  function renderList(listName,containerId,countId,withMove){
    const arr=P()[listName]; $(countId).textContent=arr.length;
    const box=$(containerId);
    if(arr.length===0){ box.className="empty-note"; box.innerHTML="아직 없어요. 아래에 추가해 보세요."; return; }
    box.className=""; let h="";
    for(const cat of CAT_ORDER){
      const list=arr.filter(it=>(it.cat||"etc")===cat);
      if(!list.length) continue;
      h+='<div class="ing-group"><div class="ing-label">'+CAT_LABEL[cat]+' <span class="ing-n">'+list.length+'</span></div><div class="items">';
      for(const it of list){
        const moveBtn=withMove?'<button class="move" data-move="'+it.id+'" title="샀어요 → 현재 있는 식재료로">→</button>':'';
        let sel="";
        if(catEdit[listName]){
          let opts=""; for(const c of CAT_ORDER) opts+='<option value="'+c+'"'+((it.cat||"etc")===c?" selected":"")+'>'+CAT_SHORT[c]+'</option>';
          sel='<select class="cat-sel" data-catsel="'+it.id+'" data-list="'+listName+'" title="분류 바꾸기">'+opts+'</select>';
        }
        h+='<span class="chip">'+esc(it.name)+sel+moveBtn+'<button class="del" data-list="'+listName+'" data-del="'+it.id+'" aria-label="삭제">×</button></span>';
      }
      h+='</div></div>';
    }
    box.innerHTML=h;
    box.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>removeItem(b.getAttribute("data-list"),b.getAttribute("data-del"))));
    if(withMove) box.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>moveToHave(b.getAttribute("data-move"))));
    box.querySelectorAll("[data-catsel]").forEach(s=>s.addEventListener("change",()=>changeItemCat(s.getAttribute("data-list"),s.getAttribute("data-catsel"),s.value)));
  }
  function changeItemCat(listName,id,cat){
    const it=P()[listName].find(x=>x.id===id); if(!it) return;
    it.cat=cat; state.categoryMap[it.name]=cat; save(); renderItems();
  }
  function addItem(listName,inputId,boxId){
    const el=$(inputId); const name=el.value.trim(); if(!name) return;
    const cat=state.categoryMap[name]||guessCategory(name);
    P()[listName].push({id:uid(),name,cat}); upsertIngredient(currentPlan,name);
    el.value=""; hideSuggest(boxId); save(); renderItems();
  }
  function removeItem(listName,id){ const a=P(); a[listName]=a[listName].filter(i=>i.id!==id); save(); renderItems(); }
  function moveToHave(id){
    const a=P(); let item=null;
    a.buy=a.buy.filter(i=>{ if(i.id===id){item=i;return false;} return true; });
    if(item) a.have.push(item); save(); renderItems();
  }

  function wireIngredientSuggest(inputId,boxId,listName){
    const inp=$(inputId);
    function build(){
      const v=inp.value.trim().toLowerCase();
      if(!v){ hideSuggest(boxId); return; }
      const have=new Set(P()[listName].map(i=>i.name));
      const matches=P().ingredientLibrary.filter(n=>n.toLowerCase().includes(v)&&!have.has(n)).slice(0,6);
      if(!matches.length){ hideSuggest(boxId); return; }
      const box=$(boxId);
      box.innerHTML=matches.map(n=>'<div class="suggest-item" data-name="'+esc(n)+'"><span class="si-name">'+esc(n)+'</span><button class="si-del" title="기억에서 지우기">×</button></div>').join("");
      box.classList.remove("hidden");
      box.querySelectorAll(".suggest-item").forEach(it=>{
        it.addEventListener("mousedown",e=>{
          e.preventDefault();
          const nm=it.getAttribute("data-name");
          P()[listName].push({id:uid(),name:nm,cat:state.categoryMap[nm]||guessCategory(nm)});
          inp.value=""; hideSuggest(boxId); save(); renderItems(); inp.focus();
        });
        it.querySelector(".si-del").addEventListener("mousedown",e=>{
          e.preventDefault(); e.stopPropagation();
          const nm=it.getAttribute("data-name");
          P().ingredientLibrary=P().ingredientLibrary.filter(x=>x!==nm);
          save(); build();
        });
      });
    }
    inp.addEventListener("input",build);
    inp.addEventListener("blur",()=>setTimeout(()=>hideSuggest(boxId),150));
  }

    }
    box.innerHTML=h;
    box.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>removeDish(b.getAttribute("data-del"))));
    box.querySelectorAll("[data-editlink]").forEach(b=>b.addEventListener("click",()=>{ editDishId=b.getAttribute("data-editlink"); renderDishes(); const i=box.querySelector('.dish-urledit[data-id="'+editDishId+'"]'); if(i) i.focus(); }));
    box.querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",()=>{ const id=b.getAttribute("data-save"); const i=box.querySelector('.dish-urledit[data-id="'+id+'"]'); saveDishUrl(id, i?i.value:""); }));
    box.querySelectorAll(".dish-urledit").forEach(i=>i.addEventListener("keydown",e=>{ if(e.key==="Enter") saveDishUrl(i.getAttribute("data-id"), i.value); }));
    box.querySelectorAll("[data-mealsel]").forEach(s=>s.addEventListener("change",()=>moveDishMeal(s.getAttribute("data-mealsel"), s.value)));
  }
  function addDish(){
    const name=$("dishName").value.trim(); if(!name) return;
    const url=normUrl($("dishUrl").value);
    const e=ensureEntry(selKey); e.dishes.push({id:uid(),name,url,meal:addMeal});
    upsertDish(currentPlan,name,url);
    $("dishName").value=""; $("dishUrl").value=""; hideSuggest("dishSuggest");
    save(); renderDishes(); renderCalendar();
  }
  function removeDish(id){ const e=P().meals[selKey]; if(!e||!e.dishes) return; e.dishes=e.dishes.filter(d=>d.id!==id); save(); renderDishes(); renderCalendar(); }
  function saveDishUrl(id,raw){
    const e=P().meals[selKey]; if(!e||!e.dishes) return;
    const d=e.dishes.find(x=>x.id===id); if(!d) return;
    d.url=normUrl(raw); upsertDish(currentPlan,d.name,d.url); editDishId=null;
    save(); renderDishes(); renderCalendar();
  }
  function moveDishMeal(id,meal){
    const e=P().meals[selKey]; if(!e||!e.dishes) return;
    const d=e.dishes.find(x=>x.id===id); if(!d) return;
    d.meal=meal; save(); renderDishes(); renderCalendar();
  }

  // 요리 등록 추천: 만든요리 + 먹고싶은메뉴(⭐), 빈칸이면 먹고싶은메뉴만
  function getDishSuggestions(q){
    const map=new Map();
    for(const d of P().dishLibrary) map.set(d.name,{name:d.name,url:d.url||"",wish:false});
    for(const w of P().wishlist){ const ex=map.get(w.name); map.set(w.name,{name:w.name,url:w.url||(ex&&ex.url)||"",wish:true}); }
    let arr=Array.from(map.values());
    const lc=(q||"").toLowerCase();
    if(lc) arr=arr.filter(x=>x.name.toLowerCase().includes(lc));
    else arr=arr.filter(x=>x.wish);
    arr.sort((a,b)=>(b.wish?1:0)-(a.wish?1:0));
    return arr.slice(0,8);
  }
  function showDishSuggest(){
    const arr=getDishSuggestions($("dishName").value.trim());
    const box=$("dishSuggest");
    if(!arr.length){ hideSuggest("dishSuggest"); return; }
    box.innerHTML=arr.map(x=>{
      const tags=[]; if(x.wish) tags.push("⭐"); if(x.url) tags.push("↗레시피");
      return '<div class="suggest-item" data-name="'+esc(x.name)+'" data-url="'+esc(x.url)+'"><span class="si-name">'+esc(x.name)+'</span>'+(tags.length?'<span class="u">'+tags.join(" ")+'</span>':'')+'<button class="si-del" title="추천에서 지우기">×</button></div>';
    }).join("");
    box.classList.remove("hidden");
    box.querySelectorAll(".suggest-item").forEach(it=>{
      it.addEventListener("mousedown",ev=>{
        ev.preventDefault();
        const nm=it.getAttribute("data-name"), u=it.getAttribute("data-url");
        const e=ensureEntry(selKey); e.dishes.push({id:uid(),name:nm,url:u,meal:addMeal}); upsertDish(currentPlan,nm,u);
        $("dishName").value=""; $("dishUrl").value="";
        save(); renderDishes(); renderCalendar(); $("dishName").focus(); showDishSuggest();
      });
      it.querySelector(".si-del").addEventListener("mousedown",ev=>{
        ev.preventDefault(); ev.stopPropagation();
        const nm=it.getAttribute("data-name");
        P().dishLibrary=P().dishLibrary.filter(d=>d.name!==nm);
        P().wishlist=P().wishlist.filter(w=>w.name!==nm);
        save(); renderWish(); showDishSuggest();
      });
    });
  }
  $("dishName").addEventListener("input",showDishSuggest);
  $("dishName").addEventListener("focus",showDishSuggest);
  $("dishName").addEventListener("blur",()=>setTimeout(()=>hideSuggest("dishSuggest"),150));
  $("dishName").addEventListener("keydown",e=>{ if(e.key==="Enter") addDish(); });
  $("dishUrl").addEventListener("keydown",e=>{ if(e.key==="Enter") addDish(); });
  $("dishAdd").addEventListener("click",addDish);
  $("mealPicker").querySelectorAll(".mp").forEach(b=> b.addEventListener("click",()=>setMealPicker(b.getAttribute("data-m"))));

  // 식단 전환
  function switchPlan(plan){
    if(plan===currentPlan) return;
    currentPlan=plan; closeSheet();
    document.body.classList.toggle("kids", plan==="kids");
    document.querySelectorAll(".plan-tab").forEach(t=> t.classList.toggle("active", t.getAttribute("data-plan")===plan));
    renderCalendar(); renderItems(); renderWish();
  }
  document.querySelectorAll(".plan-tab").forEach(t=> t.addEventListener("click",()=> switchPlan(t.getAttribute("data-plan"))));
  $("todayDash").addEventListener("click",e=>{ if(e.target.closest(".dash-link")) return; openSheet(keyOf(today.getFullYear(),today.getMonth(),today.getDate())); });

  $("prevBtn").addEventListener("click",()=>{ const n=new Date(vy,vm-1,1); vy=n.getFullYear(); vm=n.getMonth(); renderCalendar(); });
  $("nextBtn").addEventListener("click",()=>{ const n=new Date(vy,vm+1,1); vy=n.getFullYear(); vm=n.getMonth(); renderCalendar(); });
  $("todayBtn").addEventListener("click",()=>{ vy=today.getFullYear(); vm=today.getMonth(); renderCalendar(); });
  $("haveAdd").addEventListener("click",()=>addItem("have","haveInput","haveSuggest"));
  $("buyAdd").addEventListener("click",()=>addItem("buy","buyInput","buySuggest"));
  $("haveInput").addEventListener("keydown",e=>{ if(e.key==="Enter") addItem("have","haveInput","haveSuggest"); });
  $("buyInput").addEventListener("keydown",e=>{ if(e.key==="Enter") addItem("buy","buyInput","buySuggest"); });
  $("closeBtn").addEventListener("click",closeSheet);
  $("doneBtn").addEventListener("click",closeSheet);
  $("overlay").addEventListener("click",e=>{ if(e.target===$("overlay")) closeSheet(); });
  wireIngredientSuggest("haveInput","haveSuggest","have");
  wireIngredientSuggest("buyInput","buySuggest","buy");
  function toggleCatEdit(list){
    catEdit[list]=!catEdit[list];
    const btn=$(list==="have"?"haveCatEdit":"buyCatEdit");
    btn.textContent=catEdit[list]?"완료":"분류 바꾸기";
    btn.classList.toggle("on",catEdit[list]);
    renderItems();
  }
  $("haveCatEdit").addEventListener("click",()=>toggleCatEdit("have"));
  $("buyCatEdit").addEventListener("click",()=>toggleCatEdit("buy"));

  $("googleLoginBtn").addEventListener("click",async ()=>{
    $("loginError").textContent="";
    try{ await signInWithPopup(auth,provider); }
    catch(e){ console.error(e); $("loginError").textContent="로그인이 취소되었거나 실패했어요. 다시 시도해 주세요."; }
  });
  $("logoutBtn").addEventListener("click",()=>signOut(auth));

  function showOnly(id){ ["loading","loginScreen","appScreen"].forEach(s=>$(s).classList.toggle("hidden",s!==id)); }

  renderDow();
  onAuthStateChanged(auth, async (user)=>{
    if(user){
      currentUser=user; showOnly("loading");
      await loadFromCloud();
      renderCalendar(); renderItems(); renderWish(); setSave("saved");
      showOnly("appScreen");
    }else{ currentUser=null; showOnly("loginScreen"); }
  });
</script>
</body>
</html>
