<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#F5F7F1" />
<title>식단 달력</title>
<style>
  :root{
    --bg:#F5F7F1; --surface:#fff; --ink:#2A2D28; --sub:#77837A; --line:#E5E9E0;
    --green:#3E6B4E; --green-dark:#345C42; --green-soft:#EAF1EA;
    --honey:#CE8524; --honey-soft:#FBEFD9; --honey-line:#F0DCB4;
    --sun:#C0563E; --sat:#3E6B8E;
    --font:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);
    -webkit-font-smoothing:antialiased;line-height:1.4;}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px;}

  /* 헤더 */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;}
  .today-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;
    font-size:13px;font-weight:700;color:var(--green);cursor:pointer;font-family:inherit;}
  .today-btn:active{background:var(--green-soft);}

  /* 월 이동 */
  .monthbar{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px;}
  .navbtn{background:#fff;border:1px solid var(--line);border-radius:12px;width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:20px;}
  .navbtn:active{background:var(--green-soft);}
  .monthlabel{font-size:19px;font-weight:800;min-width:130px;text-align:center;letter-spacing:-.01em;}

  /* 달력 */
  .dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .dow{text-align:center;font-size:12px;font-weight:700;padding:2px 0;color:var(--sub);}
  .dow.s{color:var(--sun);} .dow.t{color:var(--sat);}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cell{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:66px;padding:6px 6px 5px;
    display:flex;flex-direction:column;cursor:pointer;overflow:hidden;text-align:left;font-family:inherit;}
  .cell:active{border-color:var(--green);}
  .cell.blank{background:transparent;border-color:transparent;cursor:default;}
  .daynum{font-size:13px;font-weight:700;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;}
  .daynum.today{background:var(--green);color:#fff;}
  .daynum.sun{color:var(--sun);} .daynum.sat{color:var(--sat);}
  .preview{font-size:11px;line-height:1.3;color:var(--sub);margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .dot{margin-top:4px;width:6px;height:6px;border-radius:50%;background:var(--honey);}

  /* 식재료 카드 */
  .cards{margin-top:26px;display:grid;gap:14px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
  .card-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em;}
  .count{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;}
  .count.g{color:var(--green);background:var(--green-soft);}
  .count.h{color:var(--honey);background:var(--honey-soft);}
  .items{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
    border-radius:999px;padding:6px 8px 6px 13px;font-size:14px;font-weight:600;}
  .chip .move{border:none;background:var(--honey-soft);color:var(--honey);border-radius:50%;width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;line-height:1;}
  .chip .del{border:none;background:none;cursor:pointer;color:var(--sub);display:flex;padding:0;font-size:15px;line-height:1;}
  .empty-note{font-size:13px;color:var(--sub);margin:0 0 13px;padding:2px 0;}
  .addrow{display:flex;gap:8px;}
  .field{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;
    font-family:inherit;color:var(--ink);background:#fff;outline:none;width:100%;}
  .field:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  .addbtn{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--green);color:#fff;
    border:none;border-radius:10px;padding:10px 15px;font-size:14px;font-weight:700;cursor:pointer;
    font-family:inherit;white-space:nowrap;}
  .addbtn:active{background:var(--green-dark);}
  .addbtn.honey{background:var(--honey);}

  .foot{text-align:center;font-size:12px;color:var(--sub);margin-top:24px;line-height:1.6;}

  /* 날짜 편집 시트 */
  .overlay{position:fixed;inset:0;background:rgba(30,40,32,.42);display:none;
    align-items:center;justify-content:center;padding:16px;z-index:50;}
  .overlay.show{display:flex;}
  .sheet{background:var(--bg);border-radius:20px;width:100%;max-width:460px;max-height:86vh;overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .sheet-in{padding:20px 20px 24px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .sheet-title{font-size:18px;font-weight:800;letter-spacing:-.01em;}
  .sheet-title span{color:var(--sub);font-weight:600;font-size:15px;}
  .closebtn{border:none;background:none;cursor:pointer;color:var(--sub);font-size:24px;line-height:1;padding:0 2px;}
  .flabel{font-size:13px;font-weight:700;color:var(--sub);display:block;margin-bottom:7px;}
  textarea.field{resize:vertical;line-height:1.5;}
  .recipes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .recipe-wrap{display:inline-flex;align-items:center;gap:4px;}
  .recipe{display:inline-flex;align-items:center;gap:7px;background:var(--honey-soft);color:var(--honey);
    border:1px solid var(--honey-line);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;
    text-decoration:none;}
  .recipe:active{background:#F7E4C2;}
  .recipe .ic{font-size:12px;}
  .done{margin-top:22px;width:100%;background:var(--green);color:#fff;border:none;border-radius:12px;
    padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
  .done:active{background:var(--green-dark);}
  .mb20{margin-bottom:20px;}
  .stack{display:flex;flex-direction:column;gap:8px;}
  @media (max-width:520px){ .cell{min-height:60px;} .preview{-webkit-line-clamp:1;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span style="font-size:24px;">🍳</span><h1>식단 달력</h1></div>
    <button class="today-btn" id="todayBtn">오늘</button>
  </div>

  <div class="monthbar">
    <button class="navbtn" id="prevBtn" aria-label="이전 달">‹</button>
    <div class="monthlabel" id="monthLabel"></div>
    <button class="navbtn" id="nextBtn" aria-label="다음 달">›</button>
  </div>

  <div class="dow-row" id="dowRow"></div>
  <div class="grid" id="grid"></div>

  <div class="cards">
    <div class="card">
      <div class="card-head">
        <span style="font-size:18px;">🧺</span><h2>현재 있는 식재료</h2>
        <span class="count g" id="haveCount">0</span>
      </div>
      <div class="items" id="haveItems"></div>
      <div class="addrow">
        <input class="field" id="haveInput" placeholder="식재료 이름" />
        <button class="addbtn" id="haveAdd">+ 추가</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span style="font-size:18px;">🛒</span><h2>구입할 식재료</h2>
        <span class="count h" id="buyCount">0</span>
      </div>
      <div class="items" id="buyItems"></div>
      <div class="addrow">
        <input class="field" id="buyInput" placeholder="식재료 이름" />
        <button class="addbtn honey" id="buyAdd">+ 추가</button>
      </div>
    </div>
  </div>

  <p class="foot">적은 내용은 이 기기에 자동으로 저장돼요.</p>
</div>

<div class="overlay" id="overlay">
  <div class="sheet"><div class="sheet-in">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle"></div>
      <button class="closebtn" id="closeBtn" aria-label="닫기">×</button>
    </div>
    <label class="flabel">오늘의 메뉴</label>
    <textarea class="field mb20" id="menuInput" rows="3" placeholder="예) 된장찌개, 계란말이, 시금치나물"></textarea>
    <label class="flabel">레시피 링크</label>
    <div class="recipes" id="recipeList"></div>
    <div class="stack">
      <input class="field" id="rcLabel" placeholder="버튼 이름 (예: 된장찌개 만드는 법)" />
      <div class="addrow">
        <input class="field" id="rcUrl" placeholder="레시피 주소 붙여넣기" />
        <button class="addbtn" id="rcAdd">+ 추가</button>
      </div>
    </div>
    <button class="done" id="doneBtn">완료</button>
  </div></div>
</div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "mealCalendar:v1";
  var WEEKDAYS = ["일","월","화","수","목","금","토"];

  var state = { meals:{}, have:[], buy:[] };
  var today = new Date();
  var vy = today.getFullYear();
  var vm = today.getMonth();
  var selKey = null; // 편집 중인 날짜 키

  // ── 저장/불러오기 (localStorage; 실패해도 앱은 동작) ──
  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var p = JSON.parse(raw);
        state = { meals:p.meals||{}, have:p.have||[], buy:p.buy||[] };
      }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  // ── 유틸 ──
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function keyOf(y,m,d){ return y + "-" + (m+1) + "-" + d; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function normUrl(u){ var t=(u||"").trim(); if(!t) return ""; return /^https?:\/\//i.test(t)?t:"https://"+t; }
  function $(id){ return document.getElementById(id); }
  function entryOf(k){ return state.meals[k] || { menu:"", recipes:[] }; }
  function hasContent(k){ var e=state.meals[k]; return e && ((e.menu&&e.menu.trim()) || (e.recipes&&e.recipes.length)); }

  // ── 요일 헤더 ──
  function renderDow(){
    var h="";
    for(var i=0;i<7;i++){
      var cls = i===0?"dow s":(i===6?"dow t":"dow");
      h += '<div class="'+cls+'">'+WEEKDAYS[i]+'</div>';
    }
    $("dowRow").innerHTML=h;
  }

  // ── 달력 ──
  function renderCalendar(){
    $("monthLabel").textContent = vy + "년 " + (vm+1) + "월";
    var firstDow = new Date(vy,vm,1).getDay();
    var days = new Date(vy,vm+1,0).getDate();
    var isThisMonth = (vy===today.getFullYear() && vm===today.getMonth());
    var h="";
    for(var b=0;b<firstDow;b++){ h+='<div class="cell blank"></div>'; }
    for(var d=1;d<=days;d++){
      var k = keyOf(vy,vm,d);
      var dow = (firstDow+d-1)%7;
      var isToday = isThisMonth && d===today.getDate();
      var numCls = "daynum" + (isToday?" today":(dow===0?" sun":(dow===6?" sat":"")));
      var inner="";
      var e = state.meals[k];
      if(e && e.menu && e.menu.trim()){
        inner = '<span class="preview">'+esc(e.menu)+'</span>';
      } else if(hasContent(k)){
        inner = '<span class="dot"></span>';
      }
      h += '<button class="cell" data-key="'+k+'"><span><span class="'+numCls+'">'+d+'</span></span>'+inner+'</button>';
    }
    var total = firstDow + days;
    while(total%7!==0){ h+='<div class="cell blank"></div>'; total++; }
    var grid = $("grid");
    grid.innerHTML=h;
    var cells = grid.querySelectorAll(".cell[data-key]");
    for(var i=0;i<cells.length;i++){
      cells[i].addEventListener("click", function(){ openSheet(this.getAttribute("data-key")); });
    }
  }

  // ── 식재료 ──
  function renderItems(){
    renderList("have","haveItems","haveCount", false);
    renderList("buy","buyItems","buyCount", true);
  }
  function renderList(listName, containerId, countId, withMove){
    var arr = state[listName];
    $(countId).textContent = arr.length;
    var box = $(containerId);
    if(arr.length===0){
      box.className="empty-note"; // reuse styling
      box.innerHTML = "아직 없어요. 아래에 추가해 보세요.";
      return;
    }
    box.className="items";
    var h="";
    for(var i=0;i<arr.length;i++){
      var it=arr[i];
      var moveBtn = withMove ? '<button class="move" data-move="'+it.id+'" title="샀어요 → 현재 있는 식재료로 옮기기">→</button>' : '';
      h += '<span class="chip">'+esc(it.name)+moveBtn+'<button class="del" data-list="'+listName+'" data-del="'+it.id+'" aria-label="삭제">×</button></span>';
    }
    box.innerHTML=h;
    var dels = box.querySelectorAll("[data-del]");
    for(var j=0;j<dels.length;j++){
      dels[j].addEventListener("click", function(){
        removeItem(this.getAttribute("data-list"), this.getAttribute("data-del"));
      });
    }
    if(withMove){
      var moves = box.querySelectorAll("[data-move]");
      for(var m=0;m<moves.length;m++){
        moves[m].addEventListener("click", function(){ moveToHave(this.getAttribute("data-move")); });
      }
    }
  }
  function addItem(listName, inputId){
    var el=$(inputId); var name=el.value.trim();
    if(!name) return;
    state[listName].push({id:uid(), name:name});
    el.value=""; save(); renderItems();
  }
  function removeItem(listName, id){
    state[listName]=state[listName].filter(function(i){return i.id!==id;});
    save(); renderItems();
  }
  function moveToHave(id){
    var item=null;
    state.buy=state.buy.filter(function(i){ if(i.id===id){item=i; return false;} return true; });
    if(item){ state.have.push(item); }
    save(); renderItems();
  }

  // ── 날짜 편집 시트 ──
  function openSheet(k){
    selKey=k;
    var parts=k.split("-"); var y=+parts[0], mo=+parts[1]-1, d=+parts[2];
    var dow=WEEKDAYS[new Date(y,mo,d).getDay()];
    $("sheetTitle").innerHTML = mo+1 + "월 " + d + "일 <span>("+dow+")</span>";
    $("menuInput").value = entryOf(k).menu || "";
    $("rcLabel").value=""; $("rcUrl").value="";
    renderRecipes();
    $("overlay").classList.add("show");
  }
  function closeSheet(){ $("overlay").classList.remove("show"); selKey=null; }
  function renderRecipes(){
    var e=entryOf(selKey); var box=$("recipeList");
    if(!e.recipes || e.recipes.length===0){ box.innerHTML=""; return; }
    var h="";
    for(var i=0;i<e.recipes.length;i++){
      var r=e.recipes[i];
      h += '<span class="recipe-wrap"><a class="recipe" href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer"><span class="ic">↗</span>'+esc(r.label)+'</a><button class="del" data-rc="'+r.id+'" aria-label="레시피 삭제">×</button></span>';
    }
    box.innerHTML=h;
    var dels=box.querySelectorAll("[data-rc]");
    for(var j=0;j<dels.length;j++){
      dels[j].addEventListener("click", function(){ removeRecipe(this.getAttribute("data-rc")); });
    }
  }
  function ensureEntry(k){
    if(!state.meals[k]) state.meals[k]={menu:"", recipes:[]};
    return state.meals[k];
  }
  function saveMenu(){
    if(!selKey) return;
    ensureEntry(selKey).menu = $("menuInput").value;
    save();
  }
  function addRecipe(){
    var url=normUrl($("rcUrl").value);
    if(!url) return;
    var label=$("rcLabel").value.trim() || "레시피 링크";
    ensureEntry(selKey).recipes.push({id:uid(), label:label, url:url});
    $("rcLabel").value=""; $("rcUrl").value="";
    save(); renderRecipes();
  }
  function removeRecipe(id){
    var e=state.meals[selKey]; if(!e) return;
    e.recipes=e.recipes.filter(function(r){return r.id!==id;});
    save(); renderRecipes();
  }

  // ── 이벤트 연결 ──
  function bind(){
    $("prevBtn").addEventListener("click", function(){ var n=new Date(vy,vm-1,1); vy=n.getFullYear(); vm=n.getMonth(); renderCalendar(); });
    $("nextBtn").addEventListener("click", function(){ var n=new Date(vy,vm+1,1); vy=n.getFullYear(); vm=n.getMonth(); renderCalendar(); });
    $("todayBtn").addEventListener("click", function(){ vy=today.getFullYear(); vm=today.getMonth(); renderCalendar(); });

    $("haveAdd").addEventListener("click", function(){ addItem("have","haveInput"); });
    $("buyAdd").addEventListener("click", function(){ addItem("buy","buyInput"); });
    $("haveInput").addEventListener("keydown", function(e){ if(e.key==="Enter") addItem("have","haveInput"); });
    $("buyInput").addEventListener("keydown", function(e){ if(e.key==="Enter") addItem("buy","buyInput"); });

    $("closeBtn").addEventListener("click", closeSheet);
    $("doneBtn").addEventListener("click", closeSheet);
    $("overlay").addEventListener("click", function(e){ if(e.target===$("overlay")){ saveMenu(); closeSheet(); } });
    $("menuInput").addEventListener("input", function(){ saveMenu(); refreshDayPreview(); });
    $("rcAdd").addEventListener("click", addRecipe);
    $("rcUrl").addEventListener("keydown", function(e){ if(e.key==="Enter") addRecipe(); });
  }
  // 메뉴 입력하는 동안 달력 미리보기도 갱신
  function refreshDayPreview(){ renderCalendar(); }

  // ── 시작 ──
  load(); renderDow(); renderCalendar(); renderItems(); bind();
})();
</script>
</body>
</html>
